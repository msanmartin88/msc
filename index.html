<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de proyectos</title>
<style>
  :root{
    --ink:#1a2230; --ink-soft:#5a6472; --line:#dde2ea; --line-strong:#c3ccd8;
    --bg:#eef1f6; --surface:#ffffff; --accent:#1f6f8b; --accent-soft:#e3eef2;
    --pend:#8892a3; --curso:#2f7bd6; --comp:#2f9e6b; --bloq:#d1495b;
    --today:#e07a1f;
    --r:7px;
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  header{background:var(--surface);border-bottom:1px solid var(--line-strong);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;cursor:pointer}
  header h1 span{color:var(--accent)}
  .grow{flex:1}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:var(--r);cursor:pointer;line-height:1}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  button.ghost{border-color:transparent;background:transparent;padding:4px 6px;color:var(--ink-soft)}
  button.ghost:hover{color:var(--bloq)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .tab{padding:7px 14px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:13px}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab.home{border-style:dashed}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:13px;margin:0;font-weight:650;color:var(--ink-soft)}
  .field{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft)}
  .field input[type=date]{font-family:var(--mono);font-size:13px}
  input,select{font-family:var(--sans);font-size:13px;border:1px solid var(--line-strong);border-radius:5px;padding:5px 7px;color:var(--ink);background:var(--surface)}
  input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  table{border-collapse:collapse;width:100%}
  th{font-size:11px;font-weight:600;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:#f7f9fc}
  td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.calc{font-family:var(--mono);color:var(--ink-soft);white-space:nowrap}
  .t-name{width:100%;min-width:180px}
  .t-name input{width:100%}
  .t-dur input{width:64px;text-align:right;font-family:var(--mono)}
  .t-pred select{max-width:170px}
  .t-status select{border:none;padding:4px 6px;border-radius:20px;font-weight:600;font-size:12px;color:#fff;cursor:pointer}
  .st-pend{background:var(--pend)} .st-curso{background:var(--curso)}
  .st-comp{background:var(--comp)} .st-bloq{background:var(--bloq)}
  .row-actions{white-space:nowrap;text-align:right}
  .add-row{padding:10px 14px}
  .overdue{color:var(--bloq);font-weight:600}
  /* gantt */
  .gantt{padding:14px}
  .gantt-scroll{overflow-x:auto}
  .gantt-grid{position:relative;min-width:600px}
  .g-row{display:grid;grid-template-columns:220px 1fr;align-items:center;height:30px;border-bottom:1px solid var(--line)}
  .g-label{padding-right:12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-track{position:relative;height:100%}
  .g-bar{position:absolute;top:7px;height:16px;border-radius:4px;min-width:3px;opacity:.92}
  .g-bar.st-pend{background:var(--pend)} .g-bar.st-curso{background:var(--curso)}
  .g-bar.st-comp{background:var(--comp)} .g-bar.st-bloq{background:var(--bloq)}
  .g-bar.late{box-shadow:0 0 0 2px var(--bloq) inset}
  .g-milestone{position:absolute;top:6px;width:16px;height:16px;background:var(--ink);transform:rotate(45deg) translateX(-8px);border-radius:3px}
  .g-axis{display:grid;grid-template-columns:220px 1fr;height:22px;border-bottom:1px solid var(--line-strong)}
  .g-axis-ticks{position:relative}
  .g-tick{position:absolute;top:0;font-size:11px;color:var(--ink-soft);font-family:var(--mono);border-left:1px solid var(--line);padding-left:3px;height:9999px}
  .g-tick span{background:var(--surface);position:relative;z-index:1;padding-right:2px}
  .g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2}
  .g-today-lab{position:absolute;top:-1px;font-size:10px;color:#fff;background:var(--today);padding:1px 4px;border-radius:3px;transform:translateX(-50%);font-family:var(--mono)}
  /* report */
  .summary{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
  .kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:110px}
  .kpi .v{font-size:22px;font-weight:680;font-family:var(--mono);letter-spacing:-.02em}
  .kpi .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .bar-mini{height:5px;border-radius:3px;margin-top:8px;background:var(--line);overflow:hidden}
  .bar-mini i{display:block;height:100%;background:var(--comp)}
  .empty{padding:40px 14px;text-align:center;color:var(--ink-soft)}
  .hint{font-size:12px;color:var(--ink-soft);padding:0 14px 12px}
  /* home */
  .home-hero{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:18px}
  .hero-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;min-width:150px;flex:1}
  .hero-kpi .v{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
  .hero-kpi .l{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .banner{position:relative;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:box-shadow .12s,transform .12s}
  .banner:hover{box-shadow:0 4px 18px rgba(26,34,48,.10);transform:translateY(-1px)}
  .banner.h-comp{border-left-color:var(--comp)} .banner.h-curso{border-left-color:var(--curso)}
  .banner.h-bloq{border-left-color:var(--bloq)} .banner.h-pend{border-left-color:var(--pend)}
  .banner-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .banner-name{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .badge{font-size:11px;font-weight:600;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge.h-comp{background:var(--comp)} .badge.h-curso{background:var(--curso)}
  .badge.h-bloq{background:var(--bloq)} .badge.h-pend{background:var(--pend)}
  .banner-pct{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px}
  .banner-pct b{font-size:26px;font-family:var(--mono);font-weight:700;letter-spacing:-.02em}
  .bar-big{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar-big i{display:block;height:100%;border-radius:5px}
  .bar-big i.h-comp{background:var(--comp)} .bar-big i.h-curso{background:var(--curso)}
  .bar-big i.h-bloq{background:var(--bloq)} .bar-big i.h-pend{background:var(--pend)}
  .banner-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-soft)}
  .banner-meta b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .new-banner{border:1.5px dashed var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);min-height:120px}
  .new-banner:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;transform:none}
  footer{max-width:1200px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--ink-soft)}
  input[type=file]{display:none}
  @media print{
    header .toolbar,.tabs,.add-row,.row-actions,.panel-head .field input,button{display:none!important}
    body{background:#fff} .panel{border-color:#ccc;break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">Gestor <span>de proyectos</span></h1>
  <div class="grow"></div>
  <div class="toolbar">
    <button onclick="newProject()">+ Proyecto</button>
    <button onclick="exportCSV()">CSV</button>
    <button onclick="exportJSON()">Respaldo JSON</button>
    <button class="primary" onclick="shareLink()">Enlace con datos</button>
    <button onclick="document.getElementById('imp').click()">Importar JSON</button>
    <button onclick="window.print()">Imprimir / PDF</button>
    <input type="file" id="imp" accept=".json" onchange="importJSON(event)">
  </div>
</header>

<main id="app"></main>

<footer>
  Se guarda solo en este equipo. Con <b>Enlace con datos</b> generas una URL que lleva tus estados dentro para abrirla en cualquier lado.
</footer>

<script>
/* ---------- estado + persistencia ---------- */
const KEY="gestor_proyectos_v1";
const STATUS={pend:"Pendiente",curso:"En curso",comp:"Completado",bloq:"Bloqueado"};
const HEALTH={comp:"Completado",curso:"En curso",bloq:"Atrasado",pend:"Sin iniciar"};
let uid=()=>Math.random().toString(36).slice(2,9);
let state,activeId,view="home";

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.projects)return d;}}catch(e){}return null;}

function seed(){
  const p={id:uid(),name:"Proyecto de ejemplo",start:isoToday(),biz:true,tasks:[]};
  const a={id:uid(),name:"Hito 1 · Consulta inicial",duration:0,predId:null,status:"comp"};
  const b={id:uid(),name:"Levantamiento de datos",duration:5,predId:a.id,status:"curso"};
  const c={id:uid(),name:"Procesamiento",duration:8,predId:b.id,status:"pend"};
  const d={id:uid(),name:"Validación",duration:3,predId:c.id,status:"pend"};
  const e={id:uid(),name:"Entrega / reporte",duration:0,predId:d.id,status:"pend"};
  p.tasks=[a,b,c,d,e];
  return {projects:[p]};
}

/* ---------- fechas ---------- */
function isoToday(){return new Date().toISOString().slice(0,10);}
function toDate(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function fmt(d){return d.toISOString?d.toISOString().slice(0,10):d;}
function fmtDate(d){const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;}
function isWeekend(d){return d.getDay()===0||d.getDay()===6;}
function snapBiz(d,biz){d=new Date(d);if(biz){while(isWeekend(d))d.setDate(d.getDate()+1);}return d;}
function addWorkingDays(start,days,biz){let d=new Date(start);if(!biz){d.setDate(d.getDate()+days);return d;}let a=0;while(a<days){d.setDate(d.getDate()+1);if(!isWeekend(d))a++;}return d;}
function nextStart(prevEnd,biz){let d=new Date(prevEnd);d.setDate(d.getDate()+1);if(biz){while(isWeekend(d))d.setDate(d.getDate()+1);}return d;}

/* ---------- cronograma (forward pass) ---------- */
function computeSchedule(p){
  const byId={};p.tasks.forEach(t=>byId[t.id]=t);
  const res={},visiting={};
  function resolve(t){
    if(res[t.id])return res[t.id];
    if(visiting[t.id]){const s=snapBiz(toDate(p.start),p.biz);res[t.id]={start:s,end:s,cycle:true};return res[t.id];}
    visiting[t.id]=true;
    let start;
    if(t.predId&&byId[t.predId]){start=nextStart(resolve(byId[t.predId]).end,p.biz);}
    else{start=snapBiz(toDate(p.start),p.biz);}
    const dur=Math.max(0,parseInt(t.duration)||0);
    const end=dur<=0?new Date(start):addWorkingDays(start,dur-1,p.biz);
    visiting[t.id]=false;
    res[t.id]={start,end,milestone:dur<=0};
    return res[t.id];
  }
  p.tasks.forEach(resolve);
  return res;
}

/* ---------- avance del proyecto ---------- */
function progress(p){
  const s=computeSchedule(p);
  let totW=0,doneW=0;
  p.tasks.forEach(t=>{const w=Math.max(parseInt(t.duration)||0,1);totW+=w;
    doneW+=t.status==="comp"?w:t.status==="curso"?w*0.5:0;});
  const pct=totW?Math.round(doneW/totW*100):0;
  const today=new Date();today.setHours(0,0,0,0);
  const overdue=p.tasks.filter(t=>{const x=s[t.id];return x.end<today&&t.status!=="comp"&&!x.milestone;}).length;
  let maxEnd=null;p.tasks.forEach(t=>{const e=s[t.id].end;if(!maxEnd||e>maxEnd)maxEnd=e;});
  const pend=p.tasks.filter(t=>t.status!=="comp").map(t=>({t,st:s[t.id].start})).sort((a,b)=>a.st-b.st);
  const next=pend[0]?.t;
  const health=!p.tasks.length?"pend":overdue?"bloq":pct>=100?"comp":pct>0?"curso":"pend";
  return {s,pct,overdue,maxEnd,next,health,count:p.tasks.length};
}

/* ---------- render principal ---------- */
function active(){return state.projects.find(p=>p.id===activeId);}
function render(){
  const app=document.getElementById("app");
  if(view==="home"||!state.projects.length){app.innerHTML=homeHTML();}
  else{
    const p=active()||state.projects[0];activeId=p.id;
    const g=progress(p);
    app.innerHTML=navHTML()+headHTML(p)+tableHTML(p,g.s)+ganttHTML(p,g.s)+reportHTML(p,g);
  }
  save();
}

/* ---------- inicio (banners) ---------- */
function homeHTML(){
  if(!state.projects.length){
    return `<div class="banners"><div class="banner new-banner" onclick="newProject()">+ Crear primer proyecto</div></div>`;
  }
  let totW=0,doneW=0,over=0;
  state.projects.forEach(p=>{const g=progress(p);
    p.tasks.forEach(t=>{const w=Math.max(parseInt(t.duration)||0,1);totW+=w;
      doneW+=t.status==="comp"?w:t.status==="curso"?w*0.5:0;});
    over+=g.overdue;});
  const overall=totW?Math.round(doneW/totW*100):0;
  const hero=`<div class="home-hero">
    <div class="hero-kpi"><div class="v num">${state.projects.length}</div><div class="l">Proyectos</div></div>
    <div class="hero-kpi"><div class="v num">${overall}%</div><div class="l">Avance global</div></div>
    <div class="hero-kpi"><div class="v num" style="color:${over?'var(--bloq)':'inherit'}">${over}</div><div class="l">Tareas atrasadas</div></div>
  </div>`;
  const banners=state.projects.map(p=>{
    const g=progress(p);
    const next=g.next?`${esc(g.next.name)} · ${fmtDate(g.s[g.next.id].start)}`:"Todo completado";
    return `<div class="banner h-${g.health}" onclick="openProject('${p.id}')">
      <div class="banner-top">
        <div class="banner-name">${esc(p.name)}</div>
        <span class="badge h-${g.health}">${HEALTH[g.health]}</span>
      </div>
      <div class="banner-pct"><b>${g.pct}%</b><span style="color:var(--ink-soft);font-size:12px">de avance</span></div>
      <div class="bar-big"><i class="h-${g.health}" style="width:${g.pct}%"></i></div>
      <div class="banner-meta">
        <span>Tareas <b>${g.count}</b></span>
        <span>Atrasadas <b style="color:${g.overdue?'var(--bloq)':'inherit'}">${g.overdue}</b></span>
        <span>Término <b>${g.maxEnd?fmtDate(g.maxEnd):'—'}</b></span>
      </div>
      <div class="banner-meta"><span>Próximo: <b>${next}</b></span></div>
    </div>`;
  }).join("");
  return hero+`<div class="banners">${banners}<div class="banner new-banner" onclick="newProject()">+ Nuevo proyecto</div></div>`;
}

/* ---------- vista de proyecto ---------- */
function navHTML(){
  return '<div class="tabs"><div class="tab home" onclick="goHome()">← Inicio</div>'+
    state.projects.map(p=>`<div class="tab ${p.id===activeId?'active':''}" onclick="openProject('${p.id}')">${esc(p.name)}</div>`).join('')+'</div>';
}
function headHTML(p){
  return `<div class="panel"><div class="panel-head">
    <input value="${esc(p.name)}" style="font-weight:650;min-width:220px" onchange="edP('${p.id}','name',this.value)">
    <label class="field">Inicio (Hito 1)
      <input type="date" value="${p.start}" onchange="edP('${p.id}','start',this.value)"></label>
    <label class="field"><input type="checkbox" ${p.biz?'checked':''} onchange="edP('${p.id}','biz',this.checked)"> Solo días hábiles</label>
    <div class="grow"></div>
    <button class="ghost" onclick="delProject('${p.id}')">Eliminar proyecto</button>
  </div>`;
}
function predOptions(p,t){
  let o=`<option value="">— (arranca en inicio)</option>`;
  p.tasks.forEach(x=>{if(x.id!==t.id)o+=`<option value="${x.id}" ${t.predId===x.id?'selected':''}>${esc(x.name)}</option>`;});
  return o;
}
function tableHTML(p,sched){
  const today=new Date();today.setHours(0,0,0,0);
  let rows=p.tasks.map((t,i)=>{
    const s=sched[t.id];
    const late=s.end<today&&t.status!=="comp"&&!s.milestone?"overdue":"";
    return `<tr>
      <td class="calc num">${i+1}</td>
      <td class="t-name"><input value="${esc(t.name)}" onchange="edT('${t.id}','name',this.value)"></td>
      <td class="t-dur"><input class="num" type="number" min="0" value="${t.duration}" onchange="edT('${t.id}','duration',this.value)" title="0 = hito"></td>
      <td class="t-pred"><select onchange="edT('${t.id}','predId',this.value||null)">${predOptions(p,t)}</select></td>
      <td class="t-status"><select class="st-${t.status}" onchange="edT('${t.id}','status',this.value)">
        ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}
      </select></td>
      <td class="calc">${s.milestone?'◆ ':''}${fmtDate(s.start)}</td>
      <td class="calc ${late}">${fmtDate(s.end)}</td>
      <td class="row-actions">
        <button class="ghost" onclick="moveT('${t.id}',-1)" title="Subir">↑</button>
        <button class="ghost" onclick="moveT('${t.id}',1)" title="Bajar">↓</button>
        <button class="ghost" onclick="delT('${t.id}')" title="Eliminar">✕</button>
      </td></tr>`;
  }).join("");
  if(!p.tasks.length)rows=`<tr><td colspan="8" class="empty">Sin tareas. Agrega la primera abajo.</td></tr>`;
  return `<div class="panel"><table>
    <thead><tr><th>#</th><th>Tarea / hito</th><th>Duración</th><th>Depende de</th><th>Estado</th><th>Inicio</th><th>Término</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="add-row"><button class="primary" onclick="addT()">+ Tarea</button></div>
    <div class="hint">Duración en días · <b>0 = hito</b> (◆) · “Depende de” encadena: la tarea parte al día siguiente del término de su predecesora. Cambia el inicio del Hito 1 o cualquier duración y todo se recalcula.</div>
  </div>`;
}
function ganttHTML(p,sched){
  if(!p.tasks.length)return "";
  let min=null,max=null;
  p.tasks.forEach(t=>{const s=sched[t.id];if(!min||s.start<min)min=s.start;if(!max||s.end>max)max=s.end;});
  min=new Date(min);max=new Date(max);min.setDate(min.getDate()-1);max.setDate(max.getDate()+1);
  const span=Math.max(1,(max-min)/86400000);
  const pct=d=>((d-min)/86400000)/span*100;
  let ticks="";const step=Math.max(1,Math.ceil(span/12));
  for(let i=0;i<=span;i+=step){const d=new Date(min);d.setDate(d.getDate()+i);
    ticks+=`<div class="g-tick" style="left:${(i/span)*100}%"><span>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span></div>`;}
  const today=new Date();today.setHours(0,0,0,0);
  let todayLine="";
  if(today>=min&&today<=max){const l=pct(today);todayLine=`<div class="g-today" style="left:${l}%"></div><div class="g-today-lab" style="left:${l}%">hoy</div>`;}
  const rows=p.tasks.map(t=>{
    const s=sched[t.id];const l=pct(s.start);
    const late=s.end<today&&t.status!=="comp"&&!s.milestone?"late":"";
    let bar;
    if(s.milestone){bar=`<div class="g-milestone" style="left:${l}%" title="${esc(t.name)} · ${fmtDate(s.start)}"></div>`;}
    else{const end=new Date(s.end);end.setDate(end.getDate()+1);const w=pct(end)-l;
      bar=`<div class="g-bar st-${t.status} ${late}" style="left:${l}%;width:${Math.max(w,0.5)}%" title="${esc(t.name)} · ${fmtDate(s.start)} → ${fmtDate(s.end)}"></div>`;}
    return `<div class="g-row"><div class="g-label">${esc(t.name)}</div><div class="g-track">${bar}</div></div>`;
  }).join("");
  return `<div class="panel"><div class="panel-head"><h2>Carta Gantt</h2></div>
    <div class="gantt"><div class="gantt-scroll"><div class="gantt-grid">
      <div class="g-axis"><div></div><div class="g-axis-ticks">${ticks}${todayLine}</div></div>
      ${rows}
    </div></div></div></div>`;
}
function reportHTML(p,g){
  if(!p.tasks.length)return "";
  return `<div class="panel"><div class="panel-head"><h2>Resumen</h2></div>
    <div class="summary">
      <div class="kpi"><div class="v num">${g.count}</div><div class="l">Tareas / hitos</div></div>
      <div class="kpi"><div class="v num">${g.pct}%</div><div class="l">Avance</div><div class="bar-mini"><i style="width:${g.pct}%"></i></div></div>
      <div class="kpi"><div class="v num" style="color:${g.overdue?'var(--bloq)':'inherit'}">${g.overdue}</div><div class="l">Atrasadas</div></div>
      <div class="kpi"><div class="v num">${g.maxEnd?fmtDate(g.maxEnd):'—'}</div><div class="l">Término estimado</div></div>
    </div></div>`;
}

/* ---------- acciones ---------- */
function goHome(){view="home";render();}
function openProject(id){activeId=id;view="project";render();}
function newProject(){const p={id:uid(),name:"Nuevo proyecto",start:isoToday(),biz:true,tasks:[]};state.projects.push(p);activeId=p.id;view="project";render();}
function delProject(id){if(!confirm("¿Eliminar este proyecto?"))return;state.projects=state.projects.filter(p=>p.id!==id);activeId=state.projects[0]?.id;view="home";render();}
function edP(id,k,v){state.projects.find(x=>x.id===id)[k]=v;render();}
function addT(){const p=active();p.tasks.push({id:uid(),name:"Nueva tarea",duration:1,predId:p.tasks.at(-1)?.id||null,status:"pend"});render();}
function edT(id,k,v){const t=active().tasks.find(x=>x.id===id);t[k]=v;render();}
function delT(id){const p=active();p.tasks=p.tasks.filter(t=>t.id!==id);p.tasks.forEach(t=>{if(t.predId===id)t.predId=null;});render();}
function moveT(id,dir){const p=active();const i=p.tasks.findIndex(t=>t.id===id);const j=i+dir;if(j<0||j>=p.tasks.length)return;[p.tasks[i],p.tasks[j]]=[p.tasks[j],p.tasks[i]];render();}

/* ---------- import / export ---------- */
function exportJSON(){download(JSON.stringify(state,null,2),"proyectos.json","application/json");}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projects)throw 0;state=d;activeId=state.projects[0]?.id;view="home";render();}
  catch(e){alert("Archivo no válido.");}};r.readAsText(f);ev.target.value="";}
function exportCSV(){
  const p=active();const s=computeSchedule(p);
  let rows=[["Proyecto","#","Tarea","Duracion_dias","Depende_de","Estado","Inicio","Termino"]];
  p.tasks.forEach((t,i)=>{const pr=t.predId?p.tasks.find(x=>x.id===t.predId)?.name||"":"";
    rows.push([p.name,i+1,t.name,t.duration,pr,STATUS[t.status],fmt(s[t.id].start),fmt(s[t.id].end)]);});
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download("\ufeff"+csv,(p.name||"proyecto")+".csv","text/csv");
}
function download(content,name,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- enlace que lleva los datos dentro de la URL ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(b){return decodeURIComponent(escape(atob(b)));}
function stateFromHash(){
  const m=location.hash.match(/[#&]d=([^&]+)/);
  if(!m)return null;
  try{const d=JSON.parse(b64dec(decodeURIComponent(m[1])));return d&&d.projects?d:null;}catch(e){return null;}
}
function shareLink(){
  const url=location.origin+location.pathname+"#d="+encodeURIComponent(b64enc(JSON.stringify(state)));
  history.replaceState(null,"",url);
  const msg="Enlace copiado. Ábrelo en cualquier equipo para recuperar tus estados.\n\nSi editas después, vuelve a usar este botón: el enlace cambia con cada actualización.";
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>alert(msg),()=>prompt("Copia este enlace:",url));}
  else{prompt("Copia este enlace:",url);}
}

/* ---------- init ---------- */
state=stateFromHash()||load()||seed();
activeId=state.projects[0]?.id;
save();
render();
</script>
