<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de proyectos</title>
<style>
  :root{
    --ink:#1a2230; --ink-soft:#5a6472; --line:#dde2ea; --line-strong:#c3ccd8;
    --bg:#eef1f6; --surface:#ffffff; --accent:#1f6f8b; --accent-soft:#e3eef2;
    --pend:#8892a3; --curso:#2f7bd6; --comp:#2f9e6b; --bloq:#d1495b;
    --today:#e07a1f;
    --r:7px;
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  header{background:var(--surface);border-bottom:1px solid var(--line-strong);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;cursor:pointer}
  header h1 span{color:var(--accent)}
  .grow{flex:1}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:var(--r);cursor:pointer;line-height:1}
  a.mini{display:inline-block}
  button:hover,a.mini:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  button.ghost{border-color:transparent;background:transparent;padding:4px 6px;color:var(--ink-soft)}
  button.ghost:hover{color:var(--bloq)}
  button.ghost.has-note{color:var(--accent)}
  button.mini,a.mini{padding:5px 9px;font-size:12px;color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);text-decoration:none}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .tab{padding:7px 14px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:13px}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab.home,.tab.sub-add{border-style:dashed}
  .subtabs{margin-bottom:12px}
  .subtabs .tab{padding:6px 12px;font-size:12px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:13px;margin:0;font-weight:650;color:var(--ink-soft)}
  .field{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft)}
  .field input[type=date]{font-family:var(--mono);font-size:13px}
  input,select,textarea{font-family:var(--sans);font-size:13px;border:1px solid var(--line-strong);border-radius:5px;padding:5px 7px;color:var(--ink);background:var(--surface)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  input[type=color]{padding:2px;height:30px;cursor:pointer}
  table{border-collapse:collapse;width:100%}
  th{font-size:11px;font-weight:600;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:#f7f9fc}
  td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.calc{font-family:var(--mono);color:var(--ink-soft);white-space:nowrap}
  .t-name{width:100%;min-width:170px}
  .t-name input{width:100%}
  .t-pred select{max-width:160px}
  .t-status select{border:none;padding:4px 6px;border-radius:20px;font-weight:600;font-size:12px;color:#fff;cursor:pointer}
  .st-pend{background:var(--pend)} .st-curso{background:var(--curso)}
  .st-comp{background:var(--comp)} .st-bloq{background:var(--bloq)}
  .t-date input{font-family:var(--mono);font-size:12px;width:140px}
  .t-date input.late{border-color:var(--bloq);color:var(--bloq)}
  .row-actions{white-space:nowrap;text-align:right}
  .note-row td{background:#f7f9fc}
  .note-row textarea{width:100%;resize:vertical;min-height:44px}
  .add-row{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* gantt */
  .gantt{padding:14px}
  .gantt-scroll{overflow-x:auto}
  .gantt-grid{position:relative}
  .g-row{display:grid;grid-template-columns:var(--lab,200px) var(--tw,1fr);align-items:center;height:30px;border-bottom:1px solid var(--line)}
  .g-label{padding-right:12px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-track{position:relative;height:100%}
  .g-bar{position:absolute;top:7px;height:16px;border-radius:4px;min-width:2px;opacity:.92}
  .g-bar.st-pend{background:var(--pend)} .g-bar.st-curso{background:var(--curso)}
  .g-bar.st-comp{background:var(--comp)} .g-bar.st-bloq{background:var(--bloq)}
  .g-bar.late{box-shadow:0 0 0 2px var(--bloq) inset}
  .g-milestone{position:absolute;top:6px;width:16px;height:16px;background:var(--ink);transform:rotate(45deg) translateX(-8px);border-radius:3px}
  .g-axis{display:grid;grid-template-columns:var(--lab,200px) var(--tw,1fr);height:22px;border-bottom:1px solid var(--line-strong)}
  .g-axis-ticks{position:relative}
  .g-tick{position:absolute;top:0;font-size:11px;color:var(--ink-soft);font-family:var(--mono);border-left:1px solid var(--line);padding-left:3px;height:9999px;white-space:nowrap}
  .g-tick span{background:var(--surface);position:relative;z-index:1;padding-right:2px}
  .g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2}
  .g-today-lab{position:absolute;top:-1px;font-size:10px;color:#fff;background:var(--today);padding:1px 4px;border-radius:3px;transform:translateX(-50%);font-family:var(--mono);z-index:3}
  /* report */
  .summary{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
  .kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:110px}
  .kpi .v{font-size:22px;font-weight:680;font-family:var(--mono);letter-spacing:-.02em}
  .kpi .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .bar-mini{height:5px;border-radius:3px;margin-top:8px;background:var(--line);overflow:hidden}
  .bar-mini i{display:block;height:100%;background:var(--comp)}
  .empty{padding:40px 14px;text-align:center;color:var(--ink-soft)}
  .hint{font-size:12px;color:var(--ink-soft);padding:0 14px 12px}
  .ro-banner{background:#fff4e6;border:1px solid #f0c68a;color:#8a5a12;padding:8px 12px;border-radius:var(--r);margin-bottom:12px;font-size:13px}
  /* home */
  .home-hero{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:18px}
  .hero-kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;min-width:150px;flex:1}
  .hero-kpi .v{font-size:30px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1}
  .hero-kpi .l{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .banner{position:relative;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:box-shadow .12s,transform .12s}
  .banner:hover{box-shadow:0 4px 18px rgba(26,34,48,.10);transform:translateY(-1px)}
  .banner-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .banner-name{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .badge{font-size:11px;font-weight:600;color:#fff;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge.h-comp{background:var(--comp)} .badge.h-curso{background:var(--curso)}
  .badge.h-bloq{background:var(--bloq)} .badge.h-pend{background:var(--pend)}
  .banner-pct{display:flex;align-items:baseline;gap:8px;margin:12px 0 6px}
  .banner-pct b{font-size:26px;font-family:var(--mono);font-weight:700;letter-spacing:-.02em}
  .bar-big{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar-big i{display:block;height:100%;border-radius:5px}
  .banner-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-soft)}
  .banner-meta b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .new-banner{border:1.5px dashed var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);min-height:120px}
  .new-banner:hover{border-color:var(--accent);color:var(--accent);box-shadow:none;transform:none}
  footer{max-width:1200px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--ink-soft)}
  input[type=file]{display:none}
  body.ro .toolbar{display:none}
  body.ro input,body.ro select,body.ro textarea{pointer-events:none;background:#f5f7fa;color:var(--ink-soft)}
  body.ro .row-actions,body.ro .add-row,body.ro .sub-add,body.ro .proj-actions,body.ro .m-reflow{display:none}
  @media print{
    header .toolbar,.tabs,.add-row,.row-actions,.panel-head button,.panel-head .field input,button{display:none!important}
    body{background:#fff} .panel{border-color:#ccc;break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">Gestor <span>de proyectos</span></h1>
  <div class="grow"></div>
  <div class="toolbar">
    <button onclick="newProject()">+ Proyecto</button>
    <button onclick="exportCSV()">CSV</button>
    <button onclick="exportJSON()">Respaldo JSON</button>
    <button class="primary" onclick="shareLink()">Enlace con datos</button>
    <button onclick="document.getElementById('imp').click()">Importar JSON</button>
    <button onclick="window.print()">Imprimir / PDF</button>
    <input type="file" id="imp" accept=".json" onchange="importJSON(event)">
  </div>
</header>

<main id="app"></main>

<footer>
  Se guarda solo en este equipo. Con <b>Enlace con datos</b> generas una URL que lleva tus estados dentro para abrirla en cualquier lado.
</footer>

<script>
/* ---------- constantes ---------- */
const KEY="gestor_proyectos_v1";
const STATUS={pend:"Pendiente",curso:"En curso",comp:"Completado",bloq:"Bloqueado"};
const HEALTH={comp:"Completado",curso:"En curso",bloq:"Atrasado",pend:"Sin iniciar"};
const PALETTE=["#1f6f8b","#2f9e6b","#7d5ba6","#e07a1f","#d1495b","#2f7bd6","#0d7d7d","#a3477a"];
let uid=()=>Math.random().toString(36).slice(2,9);
let state,activeId,activeSubId,view="home",openNotes=new Set(),readonly=false;

function save(){if(readonly)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.projects)return d;}}catch(e){}return null;}

/* ---------- fechas ---------- */
function isoToday(){return new Date().toISOString().slice(0,10);}
function toDate(iso){if(iso instanceof Date)return iso;const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function fmt(d){return d.toISOString?d.toISOString().slice(0,10):d;}
function fmtDate(d){if(!(d instanceof Date))d=toDate(d);const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;}
function isWeekend(d){return d.getDay()===0||d.getDay()===6;}
function snapBiz(d,biz){d=new Date(d);if(biz){while(isWeekend(d))d.setDate(d.getDate()+1);}return d;}
function addWorkingDays(start,days,biz){let d=new Date(start);if(!biz){d.setDate(d.getDate()+days);return d;}let a=0;while(a<days){d.setDate(d.getDate()+1);if(!isWeekend(d))a++;}return d;}
function nextStart(prevEnd,biz){let d=new Date(prevEnd);d.setDate(d.getDate()+1);if(biz){while(isWeekend(d))d.setDate(d.getDate()+1);}return d;}
function addTyped(start,n,biz){return addWorkingDays(start,n,biz);}
function daysBetween(a,b,biz){a=new Date(a);b=new Date(b);if(b<=a)return 0;if(!biz)return Math.round((b-a)/86400000);let n=0,d=new Date(a);while(d<b){d.setDate(d.getDate()+1);if(!isWeekend(d))n++;}return n;}

/* ---------- dependencias / cronograma (por etapa) ---------- */
function topoOrder(s){const byId={};s.tasks.forEach(t=>byId[t.id]=t);const seen=new Set(),out=[];
  function v(t){if(seen.has(t.id))return;seen.add(t.id);if(t.predId&&byId[t.predId])v(byId[t.predId]);out.push(t);}s.tasks.forEach(v);return out;}
function descendants(s,id){const kids={};s.tasks.forEach(t=>{if(t.predId){(kids[t.predId]=kids[t.predId]||[]).push(t.id);}});
  const set=new Set(),st=[id];while(st.length){const c=st.pop();(kids[c]||[]).forEach(k=>{if(!set.has(k)){set.add(k);st.push(k);}});}return set;}
function reflow(s,fromId){const byId={};s.tasks.forEach(t=>byId[t.id]=t);const order=topoOrder(s);
  const len={};order.forEach(t=>len[t.id]=daysBetween(toDate(t.start),toDate(t.end),s.biz));
  const move=fromId?descendants(s,fromId):null;
  order.forEach(t=>{if(fromId&&t.id===fromId)return;if(move&&!move.has(t.id))return;
    let start=(t.predId&&byId[t.predId])?nextStart(toDate(byId[t.predId].end),s.biz):snapBiz(toDate(s.start),s.biz);
    t.start=fmt(start);t.end=fmt(addTyped(start,len[t.id],s.biz));});}

/* ---------- migración ---------- */
function computeLegacy(s){const byId={};s.tasks.forEach(t=>byId[t.id]=t);const res={},vis={};
  function r(t){if(res[t.id])return res[t.id];if(vis[t.id]){const p=snapBiz(toDate(s.start),s.biz);res[t.id]={start:p,end:p};return res[t.id];}
    vis[t.id]=true;let start=(t.predId&&byId[t.predId])?nextStart(r(byId[t.predId]).end,s.biz):snapBiz(toDate(s.start),s.biz);
    const dur=Math.max(0,parseInt(t.duration)||0);const end=dur<=0?new Date(start):addWorkingDays(start,dur-1,s.biz);
    vis[t.id]=false;res[t.id]={start,end};return res[t.id];}
  s.tasks.forEach(r);return res;}
function migrateSub(s){
  if(s.biz===undefined)s.biz=true;if(s.chain===undefined)s.chain=true;
  if(s.gZoom===undefined)s.gZoom=1;if(s.gFrom===undefined)s.gFrom=null;if(s.gTo===undefined)s.gTo=null;
  if(!s.start)s.start=isoToday();
  if(s.tasks.some(t=>!t.start||!t.end)){const sc=computeLegacy(s);s.tasks.forEach(t=>{if(!t.start)t.start=fmt(sc[t.id].start);if(!t.end)t.end=fmt(sc[t.id].end);delete t.duration;});}
  s.tasks.forEach(t=>{if(t.note===undefined)t.note="";});
  return s;
}
function migrate(st){
  if(!st||!st.projects)return st;
  st.projects.forEach((p,i)=>{
    if(!p.subs){ // proyecto plano antiguo -> una etapa
      const sub={id:uid(),name:"General",start:p.start,biz:p.biz,chain:p.chain,gZoom:p.gZoom,gFrom:p.gFrom,gTo:p.gTo,tasks:p.tasks||[]};
      p.subs=[sub];["start","biz","chain","gZoom","gFrom","gTo","tasks"].forEach(k=>delete p[k]);
    }
    if(p.color===undefined)p.color=PALETTE[i%PALETTE.length];
    if(p.driveUrl===undefined)p.driveUrl="";
    if(p.showNotes===undefined)p.showNotes=false;
    p.subs.forEach(migrateSub);
  });
  return st;
}
function seed(){
  const s={id:uid(),name:"General",start:isoToday(),biz:true,chain:true,gZoom:1,gFrom:null,gTo:null,tasks:[]};
  const defs=[["Hito 1 · Consulta inicial",0],["Levantamiento de datos",5],["Procesamiento",8],["Validación",3],["Entrega / reporte",0]];
  let pe=null,pi=null;
  defs.forEach(([name,dur])=>{const start=pe?nextStart(pe,s.biz):snapBiz(toDate(s.start),s.biz);const end=dur<=0?new Date(start):addWorkingDays(start,dur-1,s.biz);
    const id=uid();s.tasks.push({id,name,start:fmt(start),end:fmt(end),predId:pi,status:"pend",note:""});pe=end;pi=id;});
  s.tasks[0].status="comp";
  return {projects:[{id:uid(),name:"Proyecto de ejemplo",color:PALETTE[0],driveUrl:"",showNotes:false,subs:[s]}]};
}

/* ---------- avance ---------- */
function progress(s){
  let totW=0,doneW=0;
  s.tasks.forEach(t=>{const w=Math.max(daysBetween(toDate(t.start),toDate(t.end),s.biz)+1,1);totW+=w;doneW+=t.status==="comp"?w:t.status==="curso"?w*0.5:0;});
  const pct=totW?Math.round(doneW/totW*100):0;const today=new Date();today.setHours(0,0,0,0);
  const overdue=s.tasks.filter(t=>toDate(t.end)<today&&t.status!=="comp").length;
  let maxEnd=null;s.tasks.forEach(t=>{const e=toDate(t.end);if(!maxEnd||e>maxEnd)maxEnd=e;});
  const pend=s.tasks.filter(t=>t.status!=="comp").map(t=>({t,st:toDate(t.start)})).sort((a,b)=>a.st-b.st);
  return {pct,overdue,maxEnd,next:pend[0]?.t,count:s.tasks.length};
}
function projProgress(p){
  const gs=p.subs.map(progress);
  const pct=gs.length?Math.round(gs.reduce((a,g)=>a+g.pct,0)/gs.length):0;
  const overdue=gs.reduce((a,g)=>a+g.overdue,0);const count=gs.reduce((a,g)=>a+g.count,0);
  let maxEnd=null;gs.forEach(g=>{if(g.maxEnd&&(!maxEnd||g.maxEnd>maxEnd))maxEnd=g.maxEnd;});
  let next=null,nd=null;gs.forEach(g=>{if(g.next){const d=toDate(g.next.start);if(!nd||d<nd){nd=d;next=g.next;}}});
  const health=!count?"pend":overdue?"bloq":pct>=100?"comp":pct>0?"curso":"pend";
  return {pct,overdue,count,maxEnd,next,health,subs:p.subs.length};
}

/* ---------- render ---------- */
function activeP(){return state.projects.find(p=>p.id===activeId);}
function activeS(){const p=activeP();if(!p)return null;let s=p.subs.find(x=>x.id===activeSubId);if(!s){s=p.subs[0];activeSubId=s&&s.id;}return s;}
function render(){
  const app=document.getElementById("app");
  const ro=readonly?`<div class="ro-banner">Vista compartida — solo lectura. Los cambios que hagas aquí no se guardan.</div>`:"";
  if(view==="home"||!state.projects.length){app.innerHTML=ro+homeHTML();}
  else{const p=activeP()||state.projects[0];activeId=p.id;const s=activeS();
    app.innerHTML=ro+navHTML()+projHeadHTML(p)+subTabsHTML(p)+headHTML(p,s)+tableHTML(p,s)+ganttHTML(s)+reportHTML(s,progress(s));}
  save();
}

function homeHTML(){
  if(!state.projects.length)return `<div class="banners"><div class="banner new-banner" onclick="newProject()">+ Crear primer proyecto</div></div>`;
  const pcts=state.projects.map(p=>projProgress(p).pct);
  const overall=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
  const over=state.projects.reduce((a,p)=>a+projProgress(p).overdue,0);
  const hero=`<div class="home-hero">
    <div class="hero-kpi"><div class="v num">${state.projects.length}</div><div class="l">Proyectos</div></div>
    <div class="hero-kpi"><div class="v num">${overall}%</div><div class="l">Avance global</div></div>
    <div class="hero-kpi"><div class="v num" style="color:${over?'var(--bloq)':'inherit'}">${over}</div><div class="l">Tareas atrasadas</div></div>
  </div>`;
  const banners=state.projects.map(p=>{const g=projProgress(p);const next=g.next?`${esc(g.next.name)} · ${fmtDate(g.next.start)}`:"Todo completado";
    return `<div class="banner" style="border-left-color:${esc(p.color||'#1f6f8b')}" onclick="openProject('${p.id}')">
      <div class="banner-top"><div class="banner-name">${esc(p.name)}</div><span class="badge h-${g.health}">${HEALTH[g.health]}</span></div>
      <div class="banner-pct"><b>${g.pct}%</b><span style="color:var(--ink-soft);font-size:12px">de avance (promedio de etapas)</span></div>
      <div class="bar-big"><i style="width:${g.pct}%;background:${esc(p.color||'#1f6f8b')}"></i></div>
      <div class="banner-meta"><span>Etapas <b>${g.subs}</b></span><span>Tareas <b>${g.count}</b></span><span>Atrasadas <b style="color:${g.overdue?'var(--bloq)':'inherit'}">${g.overdue}</b></span><span>Término <b>${g.maxEnd?fmtDate(g.maxEnd):'—'}</b></span></div>
      <div class="banner-meta"><span>Próximo: <b>${next}</b></span></div>
    </div>`;}).join("");
  return hero+`<div class="banners">${banners}<div class="banner new-banner" onclick="newProject()">+ Nuevo proyecto</div></div>`;
}

function navHTML(){
  return '<div class="tabs"><div class="tab home" onclick="goHome()">← Inicio</div>'+
    state.projects.map(p=>`<div class="tab ${p.id===activeId?'active':''}" onclick="openProject('${p.id}')"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${esc(p.color||'#1f6f8b')};margin-right:6px;vertical-align:middle"></span>${esc(p.name)}</div>`).join('')+'</div>';
}
function driveLinks(url){if(!url)return null;const m=url.match(/\/d\/([A-Za-z0-9_-]+)/)||url.match(/[?&]id=([A-Za-z0-9_-]+)/);const id=m?m[1]:null;return {open:url,download:id?`https://drive.google.com/uc?export=download&id=${id}`:null};}
function projHeadHTML(p){
  const g=projProgress(p);const dl=driveLinks(p.driveUrl);
  const driveBtns=p.driveUrl?`<a class="mini" href="${esc(p.driveUrl)}" target="_blank" rel="noopener">Abrir Drive</a>`+((dl&&dl.download)?` <a class="mini" href="${esc(dl.download)}" target="_blank" rel="noopener">Descargar</a>`:""):"";
  return `<div class="panel"><div class="panel-head">
      <input value="${esc(p.name)}" style="font-weight:650;min-width:220px" onchange="edProj('${p.id}','name',this.value)">
      <label class="field">Color<input type="color" value="${p.color||'#1f6f8b'}" onchange="edProj('${p.id}','color',this.value)"></label>
      <span class="field num" style="color:var(--ink)">Avance ${g.pct}%</span>
      <div class="grow"></div>
      <button class="mini proj-actions" onclick="shareEmail('${p.id}')">Compartir por correo</button>
      <button class="ghost proj-actions" onclick="delProject('${p.id}')">Eliminar</button>
    </div>
    <div class="panel-head" style="border-top:0">
      <label class="field" style="flex:1;min-width:260px">Drive<input value="${esc(p.driveUrl||'')}" placeholder="Pega una URL de Google Drive (archivo o carpeta)" onchange="edProj('${p.id}','driveUrl',this.value)" style="flex:1"></label>
      ${driveBtns}
    </div></div>`;
}
function subTabsHTML(p){
  return '<div class="tabs subtabs">'+p.subs.map(s=>`<div class="tab ${s.id===activeSubId?'active':''}" onclick="setSub('${s.id}')">${esc(s.name)}</div>`).join('')+'<div class="tab sub-add" onclick="addSub()">+ Etapa</div></div>';
}
function headHTML(p,s){
  return `<div class="panel"><div class="panel-head">
    <input value="${esc(s.name)}" style="font-weight:650;min-width:180px" onchange="edSub('${s.id}','name',this.value)">
    <label class="field">Inicio<input type="date" value="${s.start}" onchange="edSub('${s.id}','start',this.value)"></label>
    <label class="field"><input type="checkbox" ${s.biz?'checked':''} onchange="edSub('${s.id}','biz',this.checked)"> Días hábiles</label>
    <label class="field"><input type="checkbox" ${s.chain?'checked':''} onchange="edSub('${s.id}','chain',this.checked)"> Encadenar</label>
    <label class="field"><input type="checkbox" ${p.showNotes?'checked':''} onchange="edProj('${p.id}','showNotes',this.checked)"> Ver comentarios</label>
    <button class="mini m-reflow" onclick="reflowNow('${s.id}')">Recalcular en cadena</button>
    <div class="grow"></div>
    <button class="ghost proj-actions" onclick="delSub('${s.id}')">Eliminar etapa</button>
  </div>`;
}
function predOptions(s,t){let o=`<option value="">— (arranca en inicio)</option>`;s.tasks.forEach(x=>{if(x.id!==t.id)o+=`<option value="${x.id}" ${t.predId===x.id?'selected':''}>${esc(x.name)}</option>`;});return o;}
function durLabel(t,s){return t.start===t.end?"hito":(daysBetween(toDate(t.start),toDate(t.end),s.biz)+1)+" d";}
function tableHTML(p,s){
  const today=new Date();today.setHours(0,0,0,0);
  let rows=s.tasks.map((t,i)=>{
    const late=toDate(t.end)<today&&t.status!=="comp";const hasNote=t.note&&t.note.trim();
    const main=`<tr>
      <td class="calc num">${i+1}</td>
      <td class="t-name"><input value="${esc(t.name)}" onchange="edT('${t.id}','name',this.value)"></td>
      <td class="calc">${durLabel(t,s)}</td>
      <td class="t-pred"><select onchange="edT('${t.id}','predId',this.value||null)">${predOptions(s,t)}</select></td>
      <td class="t-status"><select class="st-${t.status}" onchange="edT('${t.id}','status',this.value)">
        ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}
      </select></td>
      <td class="t-date"><input type="date" value="${t.start}" onchange="edDate('${t.id}','start',this.value)"></td>
      <td class="t-date"><input type="date" class="${late?'late':''}" value="${t.end}" onchange="edDate('${t.id}','end',this.value)"></td>
      <td class="row-actions">
        <button class="ghost ${hasNote?'has-note':''}" onclick="toggleNote('${t.id}')" title="Comentario">✎</button>
        <button class="ghost" onclick="moveT('${t.id}',-1)" title="Subir">↑</button>
        <button class="ghost" onclick="moveT('${t.id}',1)" title="Bajar">↓</button>
        <button class="ghost" onclick="delT('${t.id}')" title="Eliminar">✕</button>
      </td></tr>`;
    const showNote=p.showNotes||openNotes.has(t.id);
    const note=showNote?`<tr class="note-row"><td></td><td colspan="7"><textarea rows="2" placeholder="Comentario / info de la etapa…" onchange="edNote('${t.id}',this.value)">${esc(t.note||'')}</textarea></td></tr>`:"";
    return main+note;
  }).join("");
  if(!s.tasks.length)rows=`<tr><td colspan="8" class="empty">Sin tareas. Agrega la primera abajo.</td></tr>`;
  return `<div class="panel"><table>
    <thead><tr><th>#</th><th>Tarea / hito</th><th>Plazo</th><th>Depende de</th><th>Estado</th><th>Inicio</th><th>Término</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="add-row"><button class="primary" onclick="addT()">+ Tarea</button></div>
    <div class="hint">Edita <b>Inicio</b> y <b>Término</b> por periodo (Inicio = Término → hito ◆). <b>Ver comentarios</b> muestra/oculta todas las notas a la vez; el <b>✎</b> abre una sola. “Encadenar” corre lo de abajo al mover una fecha.</div>
  </div>`;
}
function ganttHTML(s){
  if(!s.tasks.length)return "";
  let dmin=null,dmax=null;s.tasks.forEach(t=>{const a=toDate(t.start),b=toDate(t.end);if(!dmin||a<dmin)dmin=a;if(!dmax||b>dmax)dmax=b;});
  const padF=new Date(dmin);padF.setDate(padF.getDate()-1);const padT=new Date(dmax);padT.setDate(padT.getDate()+1);
  const winFrom=s.gFrom?toDate(s.gFrom):padF;const winTo=s.gTo?toDate(s.gTo):padT;
  const spanDays=Math.max(1,Math.round((winTo-winFrom)/86400000)+1);
  const basePpd=Math.min(40,Math.max(3,900/spanDays));const ppd=Math.min(80,Math.max(2,basePpd*(s.gZoom||1)));
  const trackW=Math.round(spanDays*ppd);const X=d=>Math.round(((toDate(d)-winFrom)/86400000)*ppd);
  const today=new Date();today.setHours(0,0,0,0);
  const stepDays=ppd>=22?1:ppd>=10?7:ppd>=5?14:30;let ticks="";
  for(let i=0;i<spanDays;i+=stepDays){const d=new Date(winFrom);d.setDate(d.getDate()+i);
    ticks+=`<div class="g-tick" style="left:${Math.round(i*ppd)}px"><span>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span></div>`;}
  let todayLine="";if(today>=winFrom&&today<=winTo){const l=X(fmt(today));todayLine=`<div class="g-today" style="left:${l}px"></div><div class="g-today-lab" style="left:${l}px">hoy</div>`;}
  const rows=s.tasks.map(t=>{const milestone=t.start===t.end;const e=toDate(t.end);
    const late=e<today&&t.status!=="comp"&&!milestone?"late":"";const left=X(t.start),right=X(t.end)+ppd;let bar="";
    if(right>0&&left<trackW){if(milestone){const l=Math.max(0,Math.min(trackW,left));bar=`<div class="g-milestone" style="left:${l}px" title="${esc(t.name)} · ${fmtDate(t.start)}"></div>`;}
      else{const l=Math.max(0,left),r=Math.min(trackW,right);bar=`<div class="g-bar st-${t.status} ${late}" style="left:${l}px;width:${Math.max(r-l,2)}px" title="${esc(t.name)} · ${fmtDate(t.start)} → ${fmtDate(t.end)}"></div>`;}}
    return `<div class="g-row"><div class="g-label" title="${esc(t.name)}">${esc(t.name)}</div><div class="g-track">${bar}</div></div>`;}).join("");
  return `<div class="panel"><div class="panel-head"><h2>Carta Gantt</h2><div class="grow"></div>
      <label class="field">Desde<input type="date" value="${fmt(winFrom)}" onchange="ganttWin('from',this.value)"></label>
      <label class="field">Hasta<input type="date" value="${fmt(winTo)}" onchange="ganttWin('to',this.value)"></label>
      <button class="mini" onclick="ganttZoom(0.7)" title="Alejar">−</button>
      <button class="mini" onclick="ganttZoom(1.4)" title="Acercar">+</button>
      <button class="mini" onclick="ganttFit()" title="Volver al periodo de los plazos">Ajustar</button>
    </div>
    <div class="gantt"><div class="gantt-scroll"><div class="gantt-grid" style="--tw:${trackW}px;width:${200+trackW}px">
      <div class="g-axis"><div></div><div class="g-axis-ticks">${ticks}${todayLine}</div></div>${rows}
    </div></div></div></div>`;
}
function reportHTML(s,g){
  if(!s.tasks.length)return "";
  return `<div class="panel"><div class="panel-head"><h2>Resumen de la etapa</h2></div>
    <div class="summary">
      <div class="kpi"><div class="v num">${g.count}</div><div class="l">Tareas / hitos</div></div>
      <div class="kpi"><div class="v num">${g.pct}%</div><div class="l">Avance</div><div class="bar-mini"><i style="width:${g.pct}%"></i></div></div>
      <div class="kpi"><div class="v num" style="color:${g.overdue?'var(--bloq)':'inherit'}">${g.overdue}</div><div class="l">Atrasadas</div></div>
      <div class="kpi"><div class="v num">${g.maxEnd?fmtDate(g.maxEnd):'—'}</div><div class="l">Término estimado</div></div>
    </div></div>`;
}

/* ---------- acciones ---------- */
function goHome(){view="home";render();}
function openProject(id){activeId=id;const p=activeP();activeSubId=p?.subs[0]?.id;view="project";render();}
function newProject(){const c=PALETTE[state.projects.length%PALETTE.length];
  const s={id:uid(),name:"General",start:isoToday(),biz:true,chain:true,gZoom:1,gFrom:null,gTo:null,tasks:[]};
  const p={id:uid(),name:"Nuevo proyecto",color:c,driveUrl:"",showNotes:false,subs:[s]};
  state.projects.push(p);activeId=p.id;activeSubId=s.id;view="project";render();}
function delProject(id){if(!confirm("¿Eliminar este proyecto y todas sus etapas?"))return;state.projects=state.projects.filter(p=>p.id!==id);activeId=state.projects[0]?.id;view="home";render();}
function edProj(id,k,v){const p=state.projects.find(x=>x.id===id);p[k]=v;render();}
function addSub(){const p=activeP();const s={id:uid(),name:"Etapa "+(p.subs.length+1),start:isoToday(),biz:true,chain:true,gZoom:1,gFrom:null,gTo:null,tasks:[]};p.subs.push(s);activeSubId=s.id;render();}
function delSub(id){const p=activeP();if(p.subs.length<=1){alert("Debe quedar al menos una etapa.");return;}if(!confirm("¿Eliminar esta etapa?"))return;p.subs=p.subs.filter(s=>s.id!==id);activeSubId=p.subs[0].id;render();}
function setSub(id){activeSubId=id;render();}
function edSub(id,k,v){const p=activeP();const s=p.subs.find(x=>x.id===id);s[k]=v;if((k==="start"||k==="biz")&&s.chain)reflow(s,null);render();}
function reflowNow(id){const s=activeP().subs.find(x=>x.id===id);reflow(s,null);render();}
function addT(){const s=activeS();const prev=s.tasks.at(-1);const start=prev?nextStart(toDate(prev.end),s.biz):snapBiz(toDate(s.start),s.biz);
  s.tasks.push({id:uid(),name:"Nueva tarea",start:fmt(start),end:fmt(addTyped(start,1,s.biz)),predId:prev?.id||null,status:"pend",note:""});render();}
function edT(id,k,v){const s=activeS();const t=s.tasks.find(x=>x.id===id);t[k]=v;if(k==="predId"&&s.chain)reflow(s,id);render();}
function edDate(id,field,val){if(!val)return;const s=activeS();const t=s.tasks.find(x=>x.id===id);t[field]=val;if(toDate(t.end)<toDate(t.start))t.end=t.start;if(s.chain)reflow(s,id);render();}
function edNote(id,val){activeS().tasks.find(t=>t.id===id).note=val;render();}
function toggleNote(id){openNotes.has(id)?openNotes.delete(id):openNotes.add(id);render();}
function delT(id){const s=activeS();s.tasks=s.tasks.filter(t=>t.id!==id);s.tasks.forEach(t=>{if(t.predId===id)t.predId=null;});render();}
function moveT(id,dir){const s=activeS();const i=s.tasks.findIndex(t=>t.id===id);const j=i+dir;if(j<0||j>=s.tasks.length)return;[s.tasks[i],s.tasks[j]]=[s.tasks[j],s.tasks[i]];render();}
function ganttZoom(f){const s=activeS();s.gZoom=Math.min(6,Math.max(0.2,(s.gZoom||1)*f));render();}
function ganttFit(){const s=activeS();s.gZoom=1;s.gFrom=null;s.gTo=null;render();}
function ganttWin(which,v){const s=activeS();s[which==="from"?"gFrom":"gTo"]=v||null;render();}

/* ---------- enlace / correo / import / export ---------- */
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(b){return decodeURIComponent(escape(atob(b)));}
function hashParam(k){const m=location.hash.match(new RegExp('[#&]'+k+'=([^&]+)'));return m?m[1]:null;}
function stateFromHash(){const d=hashParam('d');if(!d)return null;try{const o=JSON.parse(b64dec(decodeURIComponent(d)));return o&&o.projects?o:null;}catch(e){return null;}}
function shareLink(){const url=location.origin+location.pathname+"#d="+encodeURIComponent(b64enc(JSON.stringify(state)));
  history.replaceState(null,"",url);
  const msg="Enlace copiado. Ábrelo en cualquier equipo para recuperar tus estados.\n\nSi editas después, vuelve a usar este botón: el enlace cambia con cada actualización.";
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>alert(msg),()=>prompt("Copia este enlace:",url));}else{prompt("Copia este enlace:",url);}}
function shareEmail(pid){const p=state.projects.find(x=>x.id===pid);
  const url=location.origin+location.pathname+"#ro=1&d="+encodeURIComponent(b64enc(JSON.stringify({projects:[p]})));
  const subject=encodeURIComponent("Proyecto: "+p.name);
  const body=encodeURIComponent('Te comparto la vista del proyecto "'+p.name+'" (solo lectura).\n\nÁbrelo en el navegador:\n'+url+'\n\nEs una foto del estado actual; si hay cambios, te reenviaré un enlace nuevo.');
  location.href="mailto:?subject="+subject+"&body="+body;}
function exportJSON(){download(JSON.stringify(state,null,2),"proyectos.json","application/json");}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.projects)throw 0;state=migrate(d);activeId=state.projects[0]?.id;activeSubId=activeP()?.subs[0]?.id;view="home";render();}catch(e){alert("Archivo no válido.");}};r.readAsText(f);ev.target.value="";}
function exportCSV(){const p=activeP();
  let rows=[["Proyecto","Etapa","#","Tarea","Plazo","Depende_de","Estado","Inicio","Termino","Comentario"]];
  p.subs.forEach(s=>s.tasks.forEach((t,i)=>{const pr=t.predId?s.tasks.find(x=>x.id===t.predId)?.name||"":"";
    rows.push([p.name,s.name,i+1,t.name,durLabel(t,s),pr,STATUS[t.status],t.start,t.end,t.note||""]);}));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download("\ufeff"+csv,(p.name||"proyecto")+".csv","text/csv");}
function download(content,name,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- init ---------- */
(function(){
  readonly=hashParam('ro')==='1';
  const hs=stateFromHash();
  if(hs){
    if(readonly){state=migrate(hs);}
    else{const ex=load();
      if(ex&&ex.projects&&ex.projects.length&&!confirm("Este enlace trae datos. ¿Reemplazar los datos guardados en este equipo por los del enlace?")){state=migrate(ex);}
      else{state=migrate(hs);}}
  }else{state=migrate(load()||seed());}
  document.body.classList.toggle('ro',readonly);
  activeId=state.projects[0]?.id;activeSubId=activeP()?.subs[0]?.id;
  if(readonly&&state.projects.length===1){view="project";}
  render();
})();
</script>
</body>
</html>
